name: 예보 자동 갱신

on:
  schedule:
    # 매시 정각을 넘기고 45분이 지나면 "이번 시각" 관측값을 쓸 수 있게 되는데,
    # 예전엔 50분에만 확인해서 발표(약 45분)와 반영(50분) 사이 텀은 좁았지만,
    # 45분 전(비가 시각 중간에 막 시작한 경우 등)에는 계속 "직전 시각" 데이터만
    # 보여줘서 최악의 경우 거의 1시간 40분까지 안 잡히는 공백이 있었음. 15분
    # 간격으로 촘촘히 돌려서, 새 시각 데이터가 나오자마자(45분 직후) 바로
    # 잡아내고 공백을 최대한 줄임.
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch: {}  # 수동 실행 버튼도 쓸 수 있게

permissions:
  contents: write

jobs:
  update:
    # apis.data.go.kr 연결이 가끔 타임아웃 나는 경우가 있어서 재시도 로직(http_retry.py)을
    # 넣어뒀고, 위 스케줄 자체도 15분마다 돌아서 한 번 실패해도 15분 안에 자동으로 다시 채워짐.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 기상청 단기예보 수집
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
        run: |
          cd predictor
          python fetch_forecast.py --sensor ../data/sensor/sensor_merged.csv --out ../data/weather/forecast.csv

      - name: 기상청 초단기예보(6시간 이내 근접 예보) 수집
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
        run: |
          cd predictor
          python fetch_ultra_forecast.py --sensor ../data/sensor/sensor_merged.csv --out ../data/weather/ultra_forecast.csv

      - name: 기상청 초단기실황(현재 관측값) 수집
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
        run: |
          cd predictor
          python fetch_current_obs.py --sensor ../data/sensor/sensor_merged.csv --out ../data/weather/current_obs.json

      - name: 지점별 예측 생성
        run: |
          cd predictor
          python generate_predictions.py \
            --forecast ../data/weather/forecast.csv \
            --ultra-forecast ../data/weather/ultra_forecast.csv \
            --model-dir ../data/model_final \
            --sensor ../data/sensor/sensor_merged.csv \
            --current-obs ../data/weather/current_obs.json \
            --extra-points ../data/extra_points.csv \
            --point-names ../data/point_names.csv \
            --out ../frontend/points_predictions.json \
            --reference-areas-out ../frontend/reference_areas.json

      - name: 기상특보 수집
        env:
          KMA_WARN_API_KEY: ${{ secrets.KMA_WARN_API_KEY }}
        run: |
          cd predictor
          python fetch_weather_warning.py --out ../frontend/warnings.json

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/points_predictions.json frontend/reference_areas.json data/weather/forecast.csv data/weather/ultra_forecast.csv data/weather/current_obs.json frontend/warnings.json
          git diff --cached --quiet || git commit -m "예보 자동 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
