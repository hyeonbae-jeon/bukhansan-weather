name: 예보 자동 갱신

on:
  schedule:
    - cron: "10 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 기상청 단기예보 수집
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
        run: |
          cd predictor
          python fetch_forecast.py --sensor ../data/sensor/sensor_merged.csv --out ../data/weather/forecast.csv

      - name: 지점별 예측 생성
        run: |
          cd predictor
          python generate_predictions.py \
            --forecast ../data/weather/forecast.csv \
            --model-dir ../data/model_final \
            --sensor ../data/sensor/sensor_merged.csv \
            --out ../frontend/points_predictions.json

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/points_predictions.json data/weather/forecast.csv
          git diff --cached --quiet || git commit -m "예보 자동 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
