name: 예보 자동 갱신

on:
  schedule:
    # 매시 50분에 그 시간 관측값을 가져오고(초단기실황은 정시 관측을 40분 뒤에
    # 주기 때문에 50분이면 안전하게 받을 수 있음), 다음 시간 20분에 한 번 더 실행함.
    # 20분 실행은 latest_base_datetime() 로직상 "직전 시각"을 요청하게 되는데,
    # 그게 바로 조금 전 50분 실행이 요청했던 것과 같은 시각이라 — 50분 실행이
    # 네트워크 오류 등으로 실패했을 때 30분 뒤 자동으로 다시 시도하는 효과가 있음
    # (성공했을 땐 같은 값을 다시 받아오는 것뿐이라 낭비는 있지만 문제는 없음).
    - cron: "20,50 * * * *"
  workflow_dispatch: {}  # 수동 실행 버튼도 쓸 수 있게

permissions:
  contents: write

jobs:
  update:
    # apis.data.go.kr 연결이 가끔 타임아웃 나는 경우가 있어서 재시도 로직(http_retry.py)을
    # 넣어뒀고, 위 스케줄 자체도 매시 50분+다음시 20분 이렇게 두 번 돌아서 한쪽이
    # 실패해도 30분 안에 자동으로 다시 채워짐.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 기상청 단기예보 수집
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
        run: |
          cd predictor
          python fetch_forecast.py --sensor ../data/sensor/sensor_merged.csv --out ../data/weather/forecast.csv

      - name: 기상청 초단기실황(현재 관측값) 수집
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
        run: |
          cd predictor
          python fetch_current_obs.py --sensor ../data/sensor/sensor_merged.csv --out ../data/weather/current_obs.json

      - name: 지점별 예측 생성
        run: |
          cd predictor
          python generate_predictions.py \
            --forecast ../data/weather/forecast.csv \
            --model-dir ../data/model_final \
            --sensor ../data/sensor/sensor_merged.csv \
            --current-obs ../data/weather/current_obs.json \
            --extra-points ../data/extra_points.csv \
            --point-names ../data/point_names.csv \
            --out ../frontend/points_predictions.json \
            --reference-areas-out ../frontend/reference_areas.json

      - name: 기상특보 수집
        env:
          KMA_WARN_API_KEY: ${{ secrets.KMA_WARN_API_KEY }}
        run: |
          cd predictor
          python fetch_weather_warning.py --out ../frontend/warnings.json

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/points_predictions.json frontend/reference_areas.json data/weather/forecast.csv data/weather/current_obs.json frontend/warnings.json
          git diff --cached --quiet || git commit -m "예보 자동 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
