name: 예보 자동 갱신

on:
  schedule:
    # 매시 정각을 넘기고 45분이 지나면 "이번 시각" 관측값을 쓸 수 있게 되는데,
    # 예전엔 50분에만 확인해서 발표(약 45분)와 반영(50분) 사이 텀은 좁았지만,
    # 45분 전(비가 시각 중간에 막 시작한 경우 등)에는 계속 "직전 시각" 데이터만
    # 보여줘서 최악의 경우 거의 1시간 40분까지 안 잡히는 공백이 있었음. 15분
    # 간격으로 촘촘히 돌려서, 새 시각 데이터가 나오자마자(45분 직후) 바로
    # 잡아내고 공백을 최대한 줄임.
    #
    # 분(minute)을 0,15,30,45 "정각 근처"가 아니라 7,22,37,52로 살짝 어긋나게
    # 잡은 이유: GitHub 공식 문서가 "정각 근처엔 전 세계 스케줄 작업이 몰려서
    # 지연되거나 아예 건너뛰기도 하니 애매한 시각으로 잡으라"고 권장한다
    # (https://docs.github.com/actions/using-workflows/events-that-trigger-workflows#schedule).
    # 실제로 15분 간격을 기대했는데 47분, 76분, 심하면 610분(10시간)까지 벌어진
    # 이력이 있었는데, GitHub Actions의 스케줄 트리거 자체가 "최선을 다해
    # 맞추는" 방식이라 시각을 100% 보장하지 않는 게 근본 원인 — 우리 코드나
    # 설정이 잘못된 게 아니라 정각에 다들 몰려서 생기는 문제라, 어긋난 시각으로
    # 옮기는 게 실질적으로 도움이 된다.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}  # 수동 실행 버튼 — Cloudflare Worker(ops/cron-trigger-worker/)가
                          # 같은 시각에 API로 이 경로를 호출해서 스케줄 지연을 보완함

permissions:
  contents: write

# schedule과 Cloudflare Worker의 API 호출(workflow_dispatch)이 겹칠 수 있어서, 동시에
# 두 번 돌다가 git push가 충돌하는 일이 없도록 그룹을 하나로 묶어 순서대로만 실행되게 함
# (cancel-in-progress: false — 이미 돌고 있는 실행을 취소하지 않고 뒤에 줄만 세움)
concurrency:
  group: update-predictions
  cancel-in-progress: false

jobs:
  update:
    # apis.data.go.kr 연결이 가끔 타임아웃 나는 경우가 있어서 재시도 로직(http_retry.py)을
    # 넣어뒀고, 위 스케줄 자체도 15분마다 돌아서 한 번 실패해도 15분 안에 자동으로 다시 채워짐.
    # 격자 셀 8개(sensor_grids ∪ boundary_grids, kma_grid.py 참고) 조회는 병렬로 돌고
    # (fetch_forecast.py 등), 그중 한두 개가 재시도까지 다 실패해도 그 셀만 직전 값을
    # 유지한 채 건너뛰고 나머지로 계속 진행하도록 되어있어서, 예전처럼 셀 하나 때문에
    # 전체 스텝이 죽어 커밋까지 못 가는 일은 크게 줄어든 상태.
    #
    # 다만 이 스케줄 자체가 GitHub 인프라 사정으로 몇 시간씩 밀리는 문제는 워크플로우
    # 설정만으로는 못 고치는 한계라, ops/cron-trigger-worker/(Cloudflare Worker)가
    # 같은 시각에 API로 이 워크플로우를 직접 깨워주는 방식으로 보완하고 있음.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 기상청 단기예보 수집
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
        run: |
          cd predictor
          python fetch_forecast.py --sensor ../data/sensor/sensor_merged.csv --boundary ../frontend/geo/boundary.geojson --out ../data/weather/forecast.csv

      - name: 기상청 초단기예보(6시간 이내 근접 예보) 수집
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
        run: |
          cd predictor
          python fetch_ultra_forecast.py --sensor ../data/sensor/sensor_merged.csv --boundary ../frontend/geo/boundary.geojson --out ../data/weather/ultra_forecast.csv

      - name: 기상청 초단기실황(현재 관측값) 수집
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
        run: |
          cd predictor
          python fetch_current_obs.py --sensor ../data/sensor/sensor_merged.csv --boundary ../frontend/geo/boundary.geojson --out ../data/weather/current_obs.json --history-out ../data/weather/obs_history.json

      - name: AWS 실측 관측소(북한산 등 5개 지점) 수집
        env:
          KMA_HUB_AUTH_KEY: ${{ secrets.KMA_HUB_AUTH_KEY }}
        run: |
          cd predictor
          python fetch_aws_obs.py --out ../data/weather/aws_obs.json

      - name: 지점별 예측 생성
        run: |
          cd predictor
          python generate_predictions.py \
            --forecast ../data/weather/forecast.csv \
            --ultra-forecast ../data/weather/ultra_forecast.csv \
            --model-dir ../data/model_final \
            --sensor ../data/sensor/sensor_merged.csv \
            --current-obs ../data/weather/current_obs.json \
            --obs-history ../data/weather/obs_history.json \
            --extra-points ../data/extra_points.csv \
            --point-names ../data/point_names.csv \
            --elevations ../data/point_elevations.csv \
            --out ../frontend/points_predictions.json \
            --reference-areas-out ../frontend/reference_areas.json \
            --aws-obs ../data/weather/aws_obs.json

      - name: 기상특보 수집
        # 이 스텝이 실패해도(예: apis.data.go.kr 일시 타임아웃) 아래 커밋 스텝은
        # 계속 진행되게 한다. fetch_weather_warning.py는 실패 시 warnings.json을
        # 아예 새로 쓰지 않고 죽기 때문에 기존 파일이 그대로 남아있어 안전하다.
        # 예전엔 이 스텝이 맨 마지막에 있어서, 여기 하나만 실패해도 앞에서 이미
        # 성공한 예보/실황/AWS/지점별 예측 계산 결과까지 전부 커밋 못 하고 버려지는
        # 문제가 있었다.
        continue-on-error: true
        env:
          KMA_WARN_API_KEY: ${{ secrets.KMA_WARN_API_KEY }}
        run: |
          cd predictor
          python fetch_weather_warning.py --out ../frontend/warnings.json

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/points_predictions.json frontend/reference_areas.json data/weather/forecast.csv data/weather/ultra_forecast.csv data/weather/current_obs.json data/weather/obs_history.json data/weather/aws_obs.json frontend/warnings.json
          git diff --cached --quiet || git commit -m "예보 자동 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
