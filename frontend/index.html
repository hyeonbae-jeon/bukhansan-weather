<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>북한산 산길 날씨 — 지점별 미세기후 예보</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Pretendard:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script>
  /* 브이월드(VWorld) SDK는 내부적으로 document.write()로 자체 하위 스크립트(Cesium 등)를
     불러오는 구조라, 나중에 동적으로(JS로) <script> 태그를 끼워넣으면 브라우저가
     document.write 호출을 차단해버린다 (콘솔에 "asynchronously-loaded external script" 에러).
     그래서 카카오맵과 달리 브이월드는 반드시 페이지가 파싱되는 시점에 이렇게
     "정적인" <script>로 불러와야 한다.
     여기에 발급받은 브이월드 API 키를 넣어주세요 (아래 CONFIG.VWORLD_API_KEY와 같은 값). */
  window.VWORLD_API_KEY = "55A5E74D-1DB2-3073-A916-DE5E42B11EFA";
  document.write(
    '<scr' + 'ipt src="https://map.vworld.kr/js/webglMapInit.js.do?version=3.0&apiKey=' +
    window.VWORLD_API_KEY + '"></scr' + 'ipt>'
  );
</script>
<style>
  :root{
    --forest: #16302A;
    --forest-2: #1F4438;
    --stone: #6B7280;
    --parchment: #F6F2E8;
    --parchment-2: #EDE6D6;
    --ink: #20231F;
    --amber: #C97A3D;
    --teal: #3E7C8C;
    --line: rgba(32,35,31,0.12);
    --radius: 14px;
    --shadow: 0 8px 28px rgba(22,48,42,0.16);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Pretendard', sans-serif;
    color:var(--ink);
    background:var(--parchment);
    overflow:hidden;
  }
  #app{position:relative; width:100vw; height:100vh;}

  /* ===== 지도 컨테이너 ===== */
  #map2d, #map3d{
    position:absolute; inset:0; width:100%; height:100%;
  }
  #map3d{display:none;}

  /* ===== 등고선 패턴 (시그니처 요소) ===== */
  .contour-bg{
    position:absolute; inset:0; pointer-events:none; opacity:0.5;
    background-image:
      radial-gradient(circle at 30% 40%, transparent 0 40px, rgba(22,48,42,0.05) 41px, transparent 42px),
      radial-gradient(circle at 30% 40%, transparent 0 70px, rgba(22,48,42,0.05) 71px, transparent 72px),
      radial-gradient(circle at 30% 40%, transparent 0 100px, rgba(22,48,42,0.05) 101px, transparent 102px);
  }

  /* ===== 상단 바 ===== */
  #topbar{
    position:absolute; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 24px;
    background:linear-gradient(to bottom, rgba(22,48,42,0.92), rgba(22,48,42,0));
    pointer-events:none;
  }
  #topbar .brand{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:20px;
    color:#F6F2E8;
    letter-spacing:-0.01em;
    pointer-events:auto;
  }
  #topbar .brand small{
    display:block;
    font-family:'Pretendard';
    font-weight:400;
    font-size:12px;
    color:rgba(246,242,232,0.7);
    margin-top:2px;
  }

  /* ===== 지도 전환 토글 ===== */
  #map-toggle{
    pointer-events:auto;
    display:flex;
    background:rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.25);
    border-radius:999px;
    padding:4px;
    backdrop-filter:blur(6px);
  }
  #map-toggle button{
    border:none; background:transparent; cursor:pointer;
    padding:8px 18px; border-radius:999px;
    font-family:'Pretendard'; font-weight:600; font-size:13px;
    color:rgba(246,242,232,0.75);
    transition:all .2s ease;
  }
  #map-toggle button.active{
    background:var(--amber);
    color:#fff;
  }

  /* ===== 좌측 컨트롤 패널 ===== */
  #control-panel{
    position:absolute; left:20px; top:88px; z-index:20;
    width:280px;
    background:rgba(246,242,232,0.96);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px;
    backdrop-filter:blur(6px);
  }
  #control-panel h2{
    margin:0 0 12px;
    font-family:'Noto Serif KR', serif;
    font-size:15px;
    font-weight:700;
    color:var(--forest);
  }
  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  .field label{
    display:block; font-size:11px; font-weight:600; color:var(--stone);
    text-transform:uppercase; letter-spacing:0.04em; margin-bottom:6px;
  }
  #time-value{
    font-family:'JetBrains Mono', monospace;
    font-weight:700; font-size:14px; color:var(--forest-2);
  }
  input[type="range"]{
    width:100%; accent-color:var(--amber);
  }
  .layer-toggle{
    display:flex; align-items:center; gap:8px;
    font-size:13px; color:var(--ink);
    cursor:pointer;
    padding:6px 0;
  }
  .layer-toggle input{accent-color:var(--forest-2);}

  .legend{
    display:flex; align-items:center; gap:6px; margin-top:6px;
  }
  .legend-bar{
    flex:1; height:8px; border-radius:4px;
    background:linear-gradient(to right, #3E7C8C, #F2E9D8, #C94C31);
  }
  .legend-label{font-size:10px; color:var(--stone); font-family:'JetBrains Mono';}

  /* ===== 상세 패널(지점 클릭) ===== */
  #detail-panel{
    position:absolute; right:20px; top:88px; z-index:20;
    width:300px; max-height:calc(100vh - 130px);
    overflow-y:auto;
    background:rgba(246,242,232,0.97);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:20px;
    display:none;
  }
  #detail-panel.open{display:block;}
  #detail-panel .close-btn{
    float:right; border:none; background:none; cursor:pointer;
    font-size:18px; color:var(--stone); line-height:1;
  }
  #detail-panel h3{
    margin:0 0 4px; font-family:'Noto Serif KR', serif; font-size:17px; color:var(--forest);
  }
  #detail-panel .subtitle{font-size:11px; color:var(--stone); margin-bottom:14px;}
  .now-reading{
    display:flex; gap:16px; padding:14px; background:var(--parchment-2);
    border-radius:10px; margin-bottom:14px;
  }
  .now-reading .stat{flex:1; text-align:center;}
  .now-reading .stat .num{
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size:22px; color:var(--forest-2);
  }
  .now-reading .stat .unit{font-size:12px; color:var(--stone);}
  .now-reading .stat .label{font-size:11px; color:var(--stone); margin-top:2px;}
  #forecast-list{list-style:none; margin:0; padding:0; font-size:12px;}
  #forecast-list li{
    display:flex; justify-content:space-between;
    padding:6px 0; border-bottom:1px solid var(--line);
    font-family:'JetBrains Mono', monospace;
  }
  #forecast-list li.current{color:var(--amber); font-weight:700;}

  /* ===== 하단 출처 표기 ===== */
  #footer-credit{
    position:absolute; left:0; right:0; bottom:0; z-index:20;
    padding:8px 20px;
    font-size:11px; color:rgba(246,242,232,0.75);
    background:linear-gradient(to top, rgba(22,48,42,0.85), rgba(22,48,42,0));
    display:flex; justify-content:space-between;
    pointer-events:none;
  }

  #loading-overlay{
    position:absolute; inset:0; z-index:50;
    background:var(--forest);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--parchment);
    font-family:'Noto Serif KR', serif;
  }
  #loading-overlay .msg{margin-top:14px; font-size:13px; font-family:'Pretendard'; opacity:0.7;}
  .spinner{
    width:34px; height:34px; border-radius:50%;
    border:3px solid rgba(246,242,232,0.25);
    border-top-color:var(--amber);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (max-width:720px){
    #control-panel{width:calc(100% - 40px);}
    #detail-panel{width:calc(100% - 40px); left:20px; right:20px;}
  }
</style>
</head>
<body>

<div id="app">

  <div id="loading-overlay">
    <div class="spinner"></div>
    <div style="font-size:18px; font-weight:700; margin-top:16px;">북한산 산길 날씨</div>
    <div class="msg" id="loading-msg">지점 데이터를 불러오는 중...</div>
  </div>

  <div id="map2d"></div>
  <div id="map3d"><div class="contour-bg"></div></div>

  <div id="topbar">
    <div class="brand">
      북한산 산길 날씨
      <small>탐방로 지점별 미세기후 예보</small>
    </div>
    <div id="map-toggle">
      <button id="btn-2d" class="active">2D 지도</button>
      <button id="btn-3d">3D 지도</button>
    </div>
  </div>

  <div id="control-panel">
    <h2>예보 시각</h2>
    <div class="field">
      <label>선택된 시각</label>
      <div id="time-value">—</div>
      <input type="range" id="time-slider" min="0" max="0" value="0" step="1" />
    </div>
    <div class="field">
      <label>지도 레이어</label>
      <label class="layer-toggle"><input type="checkbox" id="toggle-boundary" checked> 국립공원 경계</label>
      <label class="layer-toggle"><input type="checkbox" id="toggle-trails" checked> 탐방로</label>
    </div>
    <div class="field">
      <label>온도 범례 (°C)</label>
      <div class="legend">
        <span class="legend-label" id="legend-min">-</span>
        <div class="legend-bar"></div>
        <span class="legend-label" id="legend-max">-</span>
      </div>
    </div>
  </div>

  <div id="detail-panel">
    <button class="close-btn" id="detail-close">&times;</button>
    <h3 id="detail-name">—</h3>
    <div class="subtitle" id="detail-sub">—</div>
    <div class="now-reading">
      <div class="stat">
        <div class="num" id="detail-temp">—</div>
        <div class="unit">°C</div>
        <div class="label">기온</div>
      </div>
      <div class="stat">
        <div class="num" id="detail-hum">—</div>
        <div class="unit">%</div>
        <div class="label">습도</div>
      </div>
    </div>
    <label style="display:block; font-size:11px; font-weight:600; color:var(--stone); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:8px;">전체 예보</label>
    <ul id="forecast-list"></ul>
  </div>

  <div id="footer-credit">
    <span>자료출처: 서울특별시(서울 열린데이터광장), 기상청, 국토교통부(브이월드) · 카카오맵</span>
    <span id="grid-info"></span>
  </div>

</div>

<script>
/* =========================================================
   설정 — 발급받은 키를 여기에 넣으세요
   ========================================================= */
const CONFIG = {
  KAKAO_JS_KEY: "9ec077ea84b6a8e3b5842e18758b00e1",
  // VWORLD_API_KEY는 더 이상 여기서 안 씀 — <head> 상단의 window.VWORLD_API_KEY에 넣으세요
  // (브이월드는 document.write 제약 때문에 페이지 파싱 시점에 정적으로 불러와야 해서 위치가 달라요)
  CENTER: { lat: 37.6332, lon: 126.9767 }, // 북한산 센서 지점들의 중심 좌표
};

/* =========================================================
   전역 상태
   ========================================================= */
const STATE = {
  points: [],           // points_predictions.json
  boundaryGeo: null,
  trailsGeo: null,
  times: [],             // 전체 예보 시각 목록 (오름차순)
  timeIndex: 0,
  tempRange: [10, 30],
  kakaoMap: null,
  kakaoMarkers: {},      // id -> CustomOverlay
  kakaoBoundaryPolygon: null,
  kakaoTrailPolylines: [],
  vworldMap: null,
  vworldViewer: null,
  vworldReady: false,
  vworldMarkers: {},
  vworldBoundaryDS: null,
  vworldTrailsDS: null,
  activeMap: "2d",
};

/* =========================================================
   유틸
   ========================================================= */
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error(`스크립트 로드 실패: ${src}`));
    document.head.appendChild(s);
  });
}

function tempToColor(t, min, max) {
  if (t === null || t === undefined || isNaN(t)) return "#9CA3AF";
  const ratio = Math.max(0, Math.min(1, (t - min) / (max - min || 1)));
  // 3구간 보간: 청록(#3E7C8C) -> 파치먼트(#F2E9D8) -> 적갈(#C94C31)
  const stops = [
    { p: 0.0, c: [62, 124, 140] },
    { p: 0.5, c: [242, 233, 216] },
    { p: 1.0, c: [201, 76, 49] },
  ];
  let a = stops[0], b = stops[1];
  if (ratio > 0.5) { a = stops[1]; b = stops[2]; }
  const localT = a.p === b.p ? 0 : (ratio - a.p) / (b.p - a.p);
  const c = a.c.map((v, i) => Math.round(v + (b.c[i] - v) * localT));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function fmtTime(iso) {
  const d = new Date(iso);
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  const hh = String(d.getHours()).padStart(2, "0");
  return `${mm}/${dd} ${hh}:00`;
}

function forecastAt(point, timeIso) {
  return point.forecasts.find(f => f.time === timeIso) || null;
}

/* =========================================================
   데이터 로딩
   ========================================================= */
async function loadData() {
  const [points, boundary, trails] = await Promise.all([
    fetch("points_predictions.json").then(r => r.json()),
    fetch("geo/boundary.geojson").then(r => r.json()).catch(() => null),
    fetch("geo/trails.geojson").then(r => r.json()).catch(() => null),
  ]);
  STATE.points = points;
  STATE.boundaryGeo = boundary;
  STATE.trailsGeo = trails;

  // 시각 목록: 지점마다 조금씩 다를 수 있어 합집합을 시간순 정렬
  const timeSet = new Set();
  points.forEach(p => p.forecasts.forEach(f => timeSet.add(f.time)));
  STATE.times = Array.from(timeSet).sort();
  STATE.timeIndex = 0;

  // 온도 범위(현재 선택 시각 기준으로 나중에 다시 계산하되, 우선 전체 범위로 초기화)
  const allTemps = points.flatMap(p => p.forecasts.map(f => f.temp)).filter(v => v !== null && v !== undefined);
  STATE.tempRange = [Math.floor(Math.min(...allTemps)), Math.ceil(Math.max(...allTemps))];

  document.getElementById("time-slider").max = STATE.times.length - 1;
  document.getElementById("time-slider").value = 0;
  document.getElementById("time-value").textContent = fmtTime(STATE.times[0]);
  document.getElementById("legend-min").textContent = STATE.tempRange[0];
  document.getElementById("legend-max").textContent = STATE.tempRange[1];
  document.getElementById("grid-info").textContent = `지점 ${points.length}개`;
}

/* =========================================================
   카카오맵 (2D)
   ========================================================= */
async function initKakaoMap() {
  await loadScript(`//dapi.kakao.com/v2/maps/sdk.js?appkey=${CONFIG.KAKAO_JS_KEY}&autoload=false`);
  await new Promise(resolve => kakao.maps.load(resolve));

  const center = new kakao.maps.LatLng(CONFIG.CENTER.lat, CONFIG.CENTER.lon);
  STATE.kakaoMap = new kakao.maps.Map(document.getElementById("map2d"), {
    center, level: 7,
  });

  drawKakaoMarkers();
  drawKakaoBoundary();
  drawKakaoTrails();
}

function drawKakaoMarkers() {
  const timeIso = STATE.times[STATE.timeIndex];
  STATE.points.forEach(p => {
    const f = forecastAt(p, timeIso);
    const temp = f ? f.temp : null;
    const color = tempToColor(temp, STATE.tempRange[0], STATE.tempRange[1]);

    const el = document.createElement("div");
    el.style.cssText = `
      width:18px; height:18px; border-radius:50%;
      background:${color}; border:2px solid rgba(255,255,255,0.9);
      box-shadow:0 2px 6px rgba(0,0,0,0.35); cursor:pointer;
    `;
    el.title = p.name;
    el.addEventListener("click", () => openDetail(p.id));

    const overlay = new kakao.maps.CustomOverlay({
      position: new kakao.maps.LatLng(p.lat, p.lon),
      content: el,
      yAnchor: 0.5,
    });
    overlay.setMap(STATE.kakaoMap);
    STATE.kakaoMarkers[p.id] = { overlay, el };
  });
}

function updateKakaoMarkerColors() {
  const timeIso = STATE.times[STATE.timeIndex];
  STATE.points.forEach(p => {
    const f = forecastAt(p, timeIso);
    const temp = f ? f.temp : null;
    const marker = STATE.kakaoMarkers[p.id];
    if (marker) marker.el.style.background = tempToColor(temp, STATE.tempRange[0], STATE.tempRange[1]);
  });
}

function geojsonRingToLatLngs(ring) {
  // GeoJSON 좌표는 [lon, lat] 순서 -> kakao.maps.LatLng(lat, lon)으로 변환
  return ring.map(([lon, lat]) => new kakao.maps.LatLng(lat, lon));
}

function drawKakaoBoundary() {
  if (!STATE.boundaryGeo) return;
  const paths = [];
  STATE.boundaryGeo.features.forEach(feature => {
    const geom = feature.geometry;
    const polys = geom.type === "MultiPolygon" ? geom.coordinates : [geom.coordinates];
    polys.forEach(poly => {
      // poly[0] = 외곽 링 (내부 구멍은 생략)
      paths.push(geojsonRingToLatLngs(poly[0]));
    });
  });
  STATE.kakaoBoundaryPolygon = new kakao.maps.Polygon({
    path: paths,
    strokeWeight: 2,
    strokeColor: "#16302A",
    strokeOpacity: 0.8,
    fillColor: "#16302A",
    fillOpacity: 0.06,
  });
  STATE.kakaoBoundaryPolygon.setMap(STATE.kakaoMap);
}

function drawKakaoTrails() {
  if (!STATE.trailsGeo) return;
  STATE.trailsGeo.features.forEach(feature => {
    const geom = feature.geometry;
    const lines = geom.type === "MultiLineString" ? geom.coordinates : [geom.coordinates];
    lines.forEach(line => {
      const polyline = new kakao.maps.Polyline({
        path: geojsonRingToLatLngs(line),
        strokeWeight: 3,
        strokeColor: "#C97A3D",
        strokeOpacity: 0.85,
        strokeStyle: "solid",
      });
      polyline.setMap(STATE.kakaoMap);
      STATE.kakaoTrailPolylines.push(polyline);
    });
  });
}

function setKakaoLayerVisible(layer, visible) {
  if (layer === "boundary" && STATE.kakaoBoundaryPolygon) {
    STATE.kakaoBoundaryPolygon.setMap(visible ? STATE.kakaoMap : null);
  }
  if (layer === "trails") {
    STATE.kakaoTrailPolylines.forEach(pl => pl.setMap(visible ? STATE.kakaoMap : null));
  }
}

/* =========================================================
   브이월드 (3D) — WebGL 3D API 3.0
   공식 샘플(V-world/V-world_API_sample, "[WebGL3] GeoJson 지면 위로.html") 구조를 그대로 따름.
   핵심: v3.0은 내부적으로 Cesium을 쓰고, 지도가 실제로 준비된 시점은
   map.onLoadEvent가 아니라 vw.ws3dInitCallBack 콜백으로 알려준다.
   그 안에서 전역 ws3d.viewer로 Cesium Viewer 인스턴스에 접근해서
   entities(마커)와 GeoJsonDataSource(경계/탐방로)를 다룬다.
   ========================================================= */
async function initVworldMap() {
  if (STATE.vworldReady) return;

  if (typeof vw === "undefined") {
    throw new Error(
      "브이월드 SDK(vw)가 로드되지 않았어요. <head> 상단의 window.VWORLD_API_KEY에 " +
      "실제 키를 넣었는지, 브이월드 콘솔에 이 사이트 도메인이 등록되어 있는지 확인해주세요."
    );
  }

  const options = {
    mapId: "map3d-inner",
    initPosition: new vw.CameraPosition(
      new vw.CoordZ(CONFIG.CENTER.lon, CONFIG.CENTER.lat, 4500),
      new vw.Direction(0, -75, 0)
    ),
    logo: false,
    navigation: true,
  };

  const map3dDiv = document.getElementById("map3d");
  const inner = document.createElement("div");
  inner.id = "map3d-inner";
  inner.style.cssText = "position:absolute; inset:0;";
  map3dDiv.appendChild(inner);

  STATE.vworldMap = new vw.Map();
  STATE.vworldMap.setOption(options);
  STATE.vworldMap.start();

  // ws3d(Cesium) 뷰어가 실제로 준비된 시점을 알려주는 공식 콜백
  await new Promise((resolve) => {
    vw.ws3dInitCallBack = function () {
      STATE.vworldViewer = ws3d.viewer;
      resolve();
    };
  });

  drawVworldMarkers();
  drawVworldOverlays();
  setupVworldClickHandler();

  STATE.vworldReady = true;
}

function drawVworldMarkers() {
  const viewer = STATE.vworldViewer;
  const timeIso = STATE.times[STATE.timeIndex];
  STATE.points.forEach(p => {
    const f = forecastAt(p, timeIso);
    const temp = f ? f.temp : null;
    const color = tempToColor(temp, STATE.tempRange[0], STATE.tempRange[1]);
    const entity = viewer.entities.add({
      id: `point-${p.id}`,
      position: Cesium.Cartesian3.fromDegrees(p.lon, p.lat),
      point: {
        pixelSize: 10,
        color: Cesium.Color.fromCssColorString(color),
        outlineColor: Cesium.Color.WHITE,
        outlineWidth: 2,
        heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
        disableDepthTestDistance: Number.POSITIVE_INFINITY,
      },
    });
    STATE.vworldMarkers[p.id] = entity;
  });
}

function updateVworldMarkerColors() {
  if (!STATE.vworldViewer) return;
  const timeIso = STATE.times[STATE.timeIndex];
  STATE.points.forEach(p => {
    const f = forecastAt(p, timeIso);
    const temp = f ? f.temp : null;
    const entity = STATE.vworldMarkers[p.id];
    if (entity) {
      entity.point.color = Cesium.Color.fromCssColorString(
        tempToColor(temp, STATE.tempRange[0], STATE.tempRange[1])
      );
    }
  });
}

function drawVworldOverlays() {
  const viewer = STATE.vworldViewer;

  Cesium.GeoJsonDataSource.load("geo/boundary.geojson", {
    stroke: Cesium.Color.fromCssColorString("#16302A"),
    fill: Cesium.Color.fromCssColorString("#16302A").withAlpha(0.12),
    strokeWidth: 2,
    clampToGround: true,
  }).then(ds => {
    STATE.vworldBoundaryDS = ds;
    viewer.dataSources.add(ds);
  }).catch(e => console.warn("경계 GeoJSON 로드 실패(3D):", e));

  Cesium.GeoJsonDataSource.load("geo/trails.geojson", {
    stroke: Cesium.Color.fromCssColorString("#C97A3D"),
    strokeWidth: 3,
    clampToGround: true,
  }).then(ds => {
    STATE.vworldTrailsDS = ds;
    viewer.dataSources.add(ds);
  }).catch(e => console.warn("탐방로 GeoJSON 로드 실패(3D):", e));
}

function setupVworldClickHandler() {
  const viewer = STATE.vworldViewer;
  const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
  handler.setInputAction((movement) => {
    const picked = viewer.scene.pick(movement.position);
    if (picked && picked.id && typeof picked.id.id === "string" && picked.id.id.startsWith("point-")) {
      openDetail(picked.id.id.replace("point-", ""));
    }
  }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
}

function setVworldLayerVisible(layer, visible) {
  if (layer === "boundary" && STATE.vworldBoundaryDS) STATE.vworldBoundaryDS.show = visible;
  if (layer === "trails" && STATE.vworldTrailsDS) STATE.vworldTrailsDS.show = visible;
}

/* =========================================================
   상세 패널
   ========================================================= */
function openDetail(pointId) {
  const p = STATE.points.find(pt => pt.id === pointId);
  if (!p) return;
  const timeIso = STATE.times[STATE.timeIndex];
  const f = forecastAt(p, timeIso);

  document.getElementById("detail-name").textContent = p.name;
  document.getElementById("detail-sub").textContent = `${fmtTime(timeIso)} 기준 예보`;
  document.getElementById("detail-temp").textContent = f && f.temp !== null ? f.temp.toFixed(1) : "—";
  document.getElementById("detail-hum").textContent = f && f.humidity !== null ? f.humidity.toFixed(0) : "—";

  const list = document.getElementById("forecast-list");
  list.innerHTML = "";
  p.forecasts.forEach(item => {
    const li = document.createElement("li");
    if (item.time === timeIso) li.classList.add("current");
    li.innerHTML = `<span>${fmtTime(item.time)}</span><span>${item.temp ?? "—"}°C / ${item.humidity ?? "—"}%</span>`;
    list.appendChild(li);
  });

  document.getElementById("detail-panel").classList.add("open");
}

document.getElementById("detail-close").addEventListener("click", () => {
  document.getElementById("detail-panel").classList.remove("open");
});

/* =========================================================
   컨트롤 이벤트
   ========================================================= */
document.getElementById("time-slider").addEventListener("input", (e) => {
  STATE.timeIndex = parseInt(e.target.value, 10);
  document.getElementById("time-value").textContent = fmtTime(STATE.times[STATE.timeIndex]);
  if (STATE.activeMap === "2d") updateKakaoMarkerColors();
  else if (STATE.vworldReady) updateVworldMarkerColors();
});

document.getElementById("toggle-boundary").addEventListener("change", (e) => {
  setKakaoLayerVisible("boundary", e.target.checked);
  setVworldLayerVisible("boundary", e.target.checked);
});
document.getElementById("toggle-trails").addEventListener("change", (e) => {
  setKakaoLayerVisible("trails", e.target.checked);
  setVworldLayerVisible("trails", e.target.checked);
});

document.getElementById("btn-2d").addEventListener("click", async () => {
  STATE.activeMap = "2d";
  document.getElementById("btn-2d").classList.add("active");
  document.getElementById("btn-3d").classList.remove("active");
  document.getElementById("map2d").style.display = "block";
  document.getElementById("map3d").style.display = "none";
});

document.getElementById("btn-3d").addEventListener("click", async () => {
  STATE.activeMap = "3d";
  document.getElementById("btn-3d").classList.add("active");
  document.getElementById("btn-2d").classList.remove("active");
  document.getElementById("map2d").style.display = "none";
  document.getElementById("map3d").style.display = "block";
  if (!STATE.vworldReady) {
    document.getElementById("loading-msg").textContent = "브이월드 3D 지도를 불러오는 중...";
    document.getElementById("loading-overlay").style.display = "flex";
    try {
      await initVworldMap();
    } catch (e) {
      console.error("VWorld 초기화 실패:", e);
      alert("브이월드 3D 지도를 불러오지 못했어요. API 키를 확인해주세요.");
    }
    document.getElementById("loading-overlay").style.display = "none";
  }
});

/* =========================================================
   부트스트랩
   ========================================================= */
(async function boot() {
  try {
    document.getElementById("loading-msg").textContent = "지점 데이터를 불러오는 중...";
    await loadData();
  } catch (e) {
    console.error("[데이터 로딩 실패]", e);
    document.getElementById("loading-msg").textContent =
      "지점/지도 데이터(json) 불러오기 실패: " + (e && e.message ? e.message : String(e));
    return;
  }
  try {
    document.getElementById("loading-msg").textContent = "카카오맵을 불러오는 중...";
    await initKakaoMap();
  } catch (e) {
    console.error("[카카오맵 로딩 실패]", e);
    document.getElementById("loading-msg").textContent =
      "카카오맵 불러오기 실패: " + (e && e.message ? e.message : String(e));
    return;
  }
  document.getElementById("loading-overlay").style.display = "none";
})();
</script>

</body>
</html>
